<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeblocks Agenda Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="timer-display" id="timerDisplay">00:00</div>

        <div class="card">
            <h3>Your Time Blocks</h3>
            <div id="timeBlocksList">
                </div>

            <hr>

            <h4>Add Time Block</h4>
            <div class="add-block-form">
                <input type="text" id="taskNameInput" placeholder="Task Name (e.g., Intro)">
                <input type="number" id="taskMinutesInput" placeholder="Minutes" value="10" min="1">
                <button onclick="addTimeBlock()">+ Add</button>
            </div>
        </div>

        <div class="controls">
            <button id="startStopBtn" onclick="toggleTimer()">Start timer</button>
            <button id="pauseResumeBtn" style="display: none;" onclick="pauseResumeTimer()">Pause</button>
        </div>
        <div class="io-controls">
            <button onclick="exportBlocks()">Export CSV</button>
            <input type="file" id="importFile" accept=".csv" style="display: none;" onchange="importBlocks(event)">
            <button onclick="document.getElementById('importFile').click()">Import CSV</button>
            
            <button id="modifyBtn" style="display: none;" onclick="showModifyInterface()">Modify Time</button>
        </div>
        <div class="card" id="noteSection" style="display: none; margin-top: 20px;">
            <h4>Meeting Notes</h4>
            <textarea id="noteInput" placeholder="Enter notes related to the current discussion..." rows="3"></textarea>
            <button onclick="saveNote()" style="background-color: #007bff; width: 100%;">Save Note</button>
        </div>
        <div class="card" id="reallocationInterface" style="display: none; margin-top: 20px;">
            </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
